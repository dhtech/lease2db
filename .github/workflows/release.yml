name: release

# Pushing a tag vX.Y.Z builds the binaries and publishes them as a GitHub
# release: lease2db_<version>_linux_<arch>.tar.gz and SHA256SUMS.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the latest stable Go release, whatever it is on the day
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go version
      - run: go vet ./...
      - run: go test ./...
      - name: build
        env:
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            name="lease2db_${version}_linux_${arch}"
            mkdir -p "build/${name}"
            GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "build/${name}/lease2db" ./cmd/lease2db
            cp LICENSE README.md "build/${name}/"
            cp -r contrib "build/${name}/"
            tar -C build --owner=0 --group=0 --numeric-owner -czf "dist/${name}.tar.gz" "${name}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
