name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lease2db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # the latest stable Go release, whatever it is on the day
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go version
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: test (with a real PostgreSQL)
        env:
          LEASE2DB_TEST_DSN: postgres://postgres:test@localhost:5432/lease2db_test?sslmode=disable
        run: go test -p 1 -count=1 ./...
      - run: go build ./cmd/lease2db
